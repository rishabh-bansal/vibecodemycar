# CI gate: the same steps as `npm run check`, one per line so a failure names its step.
# Tests that replay private hardware captures read git-ignored fixtures/private/ and skip when it is absent
# (packages/obd-core/test/browser-capture.test.ts, capture-regression.test.ts).
name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned to commits (v4.4.0): a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the build stamps the commit, and clone-sim.test.ts replays the writer of an earlier
          # commit with `git show` (it returns early when that commit is missing).
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Generated data matches its sources
        run: npm run check:data
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Public build boundary
        run: npm run check:public
