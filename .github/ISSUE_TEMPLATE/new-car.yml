name: Add my car
description: Ask for a car or variant that isn't listed yet.
title: "[car] <brand> <model>"
labels: [new-car]
body:
  - type: markdown
    attributes:
      value: Any Škoda or VW can already be tried as **Other model**. Tell us what happened when you did — it helps place your car on the right platform. **No VINs, please.**
  - type: input
    id: car
    attributes:
      label: Car
      placeholder: Volkswagen Polo GT 2019, 1.0 TSI AT
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: What "Other model" showed
      description: The platform the app reported after connecting, and any part numbers you saw.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
