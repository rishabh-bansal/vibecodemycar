name: Bug
description: Something in the app didn't work.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: If a change misbehaved on your car, undo it in the app first (open the feature → "Undo this change"). **No VINs, please.**
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: car
    attributes:
      label: Car and adapter
      placeholder: Taigun 2023, OBDLink CX
  - type: input
    id: browser
    attributes:
      label: Phone / computer and browser
      placeholder: Pixel 7, Chrome 142
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
